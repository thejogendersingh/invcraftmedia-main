<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&amp;family=Cinzel:wght@700;800&amp;display=swap');
      .cursive-mono {
        font-family: 'Alex Brush', cursive;
        font-size: 116px;
        font-weight: 400;
        fill: #680d17;
      }
      .names-sub {
        font-family: 'Cinzel', serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 4.5px;
        fill: #8a6014;
        text-transform: uppercase;
      }
    </style>
    
    <linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996e1b"/>
      <stop offset="25%" stop-color="#e8c86d"/>
      <stop offset="50%" stop-color="#b38728"/>
      <stop offset="75%" stop-color="#fae7a5"/>
      <stop offset="100%" stop-color="#8a5c10"/>
    </linearGradient>

    <radialGradient id="pureWhiteBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="90%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </radialGradient>
  </defs>

  <!-- Clean Pure White Circle Base (Radius 225 inside 500x500 = 25px safe margin) -->
  <circle cx="250" cy="250" r="225" fill="url(#pureWhiteBg)"/>

  <!-- Solid Gold Outer Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldBorderGrad)" stroke-width="8"/>

  <!-- Dashed Inner Ring with ample breathing room -->
  <circle cx="250" cy="250" r="202" fill="none" stroke="url(#goldBorderGrad)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="250" cy="250" r="192" fill="none" stroke="url(#goldBorderGrad)" stroke-width="1.5"/>

  <!-- Top Decorative Crown Motif -->
  <g transform="translate(250, 105) scale(0.7)" fill="url(#goldBorderGrad)">
    <circle cx="0" cy="-12" r="4.5"/>
    <path d="M-30,0 C-12,-10 12,-10 30,0 C12,4 -12,4 -30,0 Z"/>
    <circle cx="-16" cy="-4" r="2"/>
    <circle cx="16" cy="-4" r="2"/>
  </g>

  <!-- Perfectly Sized & Centered Cursive Monogram: Capital A & B in Alex Brush -->
  <text x="250" y="242" class="cursive-mono" text-anchor="middle">A &amp; B</text>

  <!-- Names Subtitle -->
  <text x="250" y="295" class="names-sub" text-anchor="middle">ASHISH &amp; BHAVANISHREE</text>

  <!-- Bottom Decorative Motif -->
  <g transform="translate(250, 335) scale(0.7)" fill="url(#goldBorderGrad)">
    <path d="M-25,0 C-10,-6 10,-6 25,0 C10,3 -10,3 -25,0 Z"/>
    <circle cx="0" cy="8" r="3.5"/>
  </g>
</svg>

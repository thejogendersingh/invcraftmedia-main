<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a5d1b"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f9e295"/>
      <stop offset="75%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6e4610"/>
    </linearGradient>
  </defs>
  <!-- White circular seal -->
  <circle cx="250" cy="250" r="236" fill="url(#bg)" stroke="url(#gold)" stroke-width="12"/>
  <circle cx="250" cy="250" r="216" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="6,4"/>
  <circle cx="250" cy="250" r="202" fill="none" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Cursive A & B text -->
  <text x="250" y="275" font-family="'Great Vibes', 'Brush Script MT', cursive" font-size="160" font-weight="bold" fill="url(#gold)" text-anchor="middle">A &amp; B</text>
  <text x="250" y="340" font-family="'Cinzel', 'Times New Roman', serif" font-size="20" letter-spacing="6" font-weight="700" fill="#7a1420" text-anchor="middle">ASHISH &amp; BHAVANISHREE</text>
</svg>


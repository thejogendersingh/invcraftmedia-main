<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Metallic olive green gradients -->
    <linearGradient id="oliveGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d6139"/>
      <stop offset="25%" stop-color="#69824f"/>
      <stop offset="50%" stop-color="#3d4f2c"/>
      <stop offset="75%" stop-color="#7a975e"/>
      <stop offset="100%" stop-color="#2c3a1e"/>
    </linearGradient>

    <linearGradient id="oliveHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374828"/>
      <stop offset="40%" stop-color="#738d58"/>
      <stop offset="60%" stop-color="#95b376"/>
      <stop offset="100%" stop-color="#4a5d36"/>
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="monogramShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#1a2512" flood-opacity="0.38"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>

    <!-- Emboss texture filter -->
    <filter id="metallicEmboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant="1.2" specularExponent="20" lighting-color="#eaf3db" result="specOut">
        <fePointLight x="-50" y="-100" z="200"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specIn"/>
      <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
    </filter>
  </defs>

  <g filter="url(#monogramShadow)">
    <!-- Letter D Flourish Background Loop -->
    <path d="M 125,75 C 95,85 70,115 70,160 C 70,225 110,315 170,325 C 205,330 240,310 265,275 C 290,240 295,195 285,150 C 275,105 230,70 170,70 Z" 
          fill="none" stroke="url(#oliveGoldGrad)" stroke-width="6" opacity="0.15" />

    <!-- Letter D: Royal Serifs & Flowing Arc -->
    <!-- Stem of D -->
    <path d="M 115,80 C 118,105 120,130 120,175 L 120,290 C 120,315 110,325 95,330 L 95,336 C 115,336 145,336 165,336 L 165,330 C 150,325 142,315 142,290 L 142,125 C 142,100 152,90 168,86 L 168,80 Z" 
          fill="url(#oliveGoldGrad)" stroke="url(#oliveHighlight)" stroke-width="1"/>
    
    <!-- Bold Sweeping Loop of D -->
    <path d="M 142,86 C 185,86 245,100 270,145 C 295,190 285,255 240,298 C 205,330 160,334 142,334 C 152,324 160,310 165,295 C 205,290 245,260 252,210 C 260,155 220,108 152,102 C 145,101 142,95 142,86 Z" 
          fill="url(#oliveHighlight)" stroke="url(#oliveGoldGrad)" stroke-width="1.2"/>

    <!-- Letter S: Intertwined Elegant Script Sweeps -->
    <!-- Top Curl of S -->
    <path d="M 215,82 C 240,65 275,65 295,80 C 310,92 318,110 312,128 C 304,150 280,165 255,180 C 225,198 185,220 185,255 C 185,285 210,305 245,305 C 275,305 305,285 320,260 L 326,264 C 308,295 270,320 235,320 C 190,320 160,290 160,250 C 160,205 205,180 235,160 C 265,140 292,125 292,105 C 292,90 280,78 262,78 C 238,78 215,96 208,118 L 202,116 C 206,98 210,88 215,82 Z" 
          fill="url(#oliveGoldGrad)" stroke="url(#oliveHighlight)" stroke-width="1.2"/>

    <!-- Central Connecting Heart -->
    <g transform="translate(195, 205) scale(0.95)">
      <!-- Outer Heart -->
      <path d="M 0,22 C -1,-3 -26,-15 -38,0 C -52,17 -38,42 0,72 C 38,42 52,17 38,0 C 26,-15 1,-3 0,22 Z" 
            fill="none" stroke="url(#oliveGoldGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Inner Heart Glow -->
      <path d="M 0,22 C -1,-3 -26,-15 -38,0 C -52,17 -38,42 0,72 C 38,42 52,17 38,0 C 26,-15 1,-3 0,22 Z" 
            fill="none" stroke="url(#oliveHighlight)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Elegant Swash Tails -->
    <path d="M 95,330 C 65,330 40,305 40,270 C 40,230 75,200 115,195 L 115,203 C 82,208 52,232 52,268 C 52,295 72,318 98,318 C 108,318 116,312 118,304 Z" 
          fill="url(#oliveGoldGrad)"/>
    <path d="M 320,260 C 338,245 352,220 352,190 C 352,150 325,120 285,115 L 285,123 C 318,128 340,152 340,188 C 340,215 328,236 312,252 Z" 
          fill="url(#oliveHighlight)"/>
  </g>
</svg>

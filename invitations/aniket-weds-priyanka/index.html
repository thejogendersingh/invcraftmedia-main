  <body>
    <div id="root"></div>

    <!-- Hidden Background Music Player (No floating UI button) -->
    <audio id="wedding-audio" src="./assets/audio.mp3" loop preload="auto"></audio>

    <!-- Background Music Controller: Starts strictly when intro is touched -->
    <script>
      (function() {
        const audio = document.getElementById('wedding-audio');
        let isStarted = false;

        function playMusic() {
          if (!isStarted && audio) {
            isStarted = true;
            audio.play().catch(function(e) {
              console.warn('Audio play error:', e);
            });
          }
        }

        // Global function called when intro is touched / clicked
        window.__startWeddingMusic = playMusic;

        // Fail-safe delegation for intro click
        document.addEventListener('pointerdown', function(e) {
          if (isStarted) return;
          const introEl = e.target && e.target.closest && (e.target.closest('.opening') || e.target.closest('[data-intro]') || e.target.closest('.opening__center-action'));
          if (introEl) {
            playMusic();
          }
        }, { passive: true });
      })();
    </script>
